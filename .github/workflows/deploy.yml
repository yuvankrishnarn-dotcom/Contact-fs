name: Build and Deploy

on:
  push:
    branches:
      - master

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:

    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USER }}
        password: ${{ secrets.DOCKER_TOKEN }}

    - name: Build frontend image
      run: docker build -t ${{ secrets.DOCKER_USER }}/contact-pri:contact-fe ./frontend

    - name: Push frontend image
      run: docker push ${{ secrets.DOCKER_USER }}/contact-pri:contact-fe

    - name: Build backend image
      run: docker build -t ${{ secrets.DOCKER_USER }}/contact-pri:contact-be ./backend

    - name: Push backend image
      run: docker push ${{ secrets.DOCKER_USER }}/contact-pri:contact-be

    - name: Deploy to EC2
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |

          docker login -u ${{ secrets.DOCKER_USER }} -p ${{ secrets.DOCKER_TOKEN }}

          docker pull ${{ secrets.DOCKER_USER }}/contact-pri:contact-fe
          docker pull ${{ secrets.DOCKER_USER }}/contact-pri:contact-be

          docker stop frontend || true
          docker stop backend || true

          docker rm frontend || true
          docker rm backend || true

          docker run -d \
            --name frontend \
            -p 80:80 \
            ${{ secrets.DOCKER_USER }}/contact-pri:contact-fe

          docker run -d \
            --name backend \
            -p 8000:3000 \
            ${{ secrets.DOCKER_USER }}/contact-pri:contact-be

          docker image prune -af
